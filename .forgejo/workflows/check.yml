# The full check of a pull request on every push to it: the kit's template
# (pipeline/forgejo/check.yml; pipeline/docs/README.md, "Forgejo") with this
# project's runner, baluk-host (.claude/rules/tools.md, "CI").
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

jobs:
  full-check:
    runs-on: baluk-host
    # A cold run takes tens of minutes; a runner takes one job at a time, so the
    # time in the queue is not counted.
    timeout-minutes: 180
    steps:
      - name: check-pr.sh
        shell: bash
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          : "${PIPELINE_MAIN:?PIPELINE_MAIN is not set: run pipeline/scripts/ci-runner.sh install}"
          exec "$PIPELINE_MAIN/pipeline/scripts/check-pr.sh" "$PR"
