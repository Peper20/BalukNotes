[package]
name = "notes-store"
description = "The light part of the core, without Typst: names, vault files and their watcher, accounts, sessions, sync"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Exports the API types to app/src/lib/api/types (cd app && npm run types).
ts = ["dep:ts-rs"]

[dependencies]
# Password hashes (accounts.rs): Argon2id, the PHC string format.
argon2 = "0.5"
# Session tokens and password salts.
rand = "0.8"
base64 = "0.22"
# Hashes of session tokens and of synced files: the version typst already pulls.
sha2 = "0.10"
dirs.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true
ts-rs = { workspace = true, optional = true }

# The vault watcher (`storage.rs`); browsers have none.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
notify.workspace = true

# The system trash for deleted notes (`storage.rs`); phones and browsers have
# none.
[target.'cfg(not(any(target_os = "android", target_os = "ios", target_family = "wasm")))'.dependencies]
trash.workspace = true

# Randomness in the browser (WASM): `crypto.getRandomValues` (rand and argon2
# use getrandom 0.2, which refuses wasm32-unknown-unknown without it).
[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
