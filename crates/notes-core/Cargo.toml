[package]
name = "notes-core"
description = "The core: the note vault, Typst -> HTML compiling, themes, links, settings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Exports the API types to app/src/lib/api/types (cd app && npm run types).
ts = ["dep:ts-rs", "notes-store/ts"]
# Heavy measurements of memory and rebuilds (docs/research/E5.md): each needs
# its own process, so they are separate binaries built only on request
# (otherwise every `cargo test` links three more of about 100 MB each).
measure = []

[[test]]
name = "memory_release"
required-features = ["measure"]

[[test]]
name = "memory_release_idle"
required-features = ["measure"]

[[test]]
name = "memo_regression"
required-features = ["measure"]

[dependencies]
notes-store.workspace = true
brotli.workspace = true
ttf2woff2.workspace = true
fontcull.workspace = true
ttf-parser.workspace = true
skrifa.workspace = true
write-fonts.workspace = true
kurbo.workspace = true
typst.workspace = true
typst-html.workspace = true
typst-layout.workspace = true
typst-pdf.workspace = true
typst-render.workspace = true
typst-kit.workspace = true
comemo.workspace = true
ecow.workspace = true
parking_lot.workspace = true
rust-embed.workspace = true
serde.workspace = true
serde_json.workspace = true
siphasher.workspace = true
thiserror.workspace = true
# The folder file `_folder.toml` (folders.rs).
toml.workspace = true
tracing.workspace = true
ts-rs = { workspace = true, optional = true }
# NFC of file names made from titles (new_note.rs).
unicode-normalization.workspace = true

# Native targets: embedded and system fonts, package files on disk and their
# downloader. The browser (WASM, crates/notes-wasm) has none of these: fonts
# are files the host hands over (`Fonts::from_files`), packages come from the
# vault storage (`world::Packages`).
[target.'cfg(not(target_family = "wasm"))'.dependencies]
typst-kit = { workspace = true, features = ["embedded-fonts", "scan-fonts", "system-files", "system-downloader"] }

# The browser has no `std::time::Instant` (it panics on wasm32-unknown-unknown):
# `crate::time` takes it from `performance.now()`. It has no disk either, so the
# library and fonts are embedded in a debug build too.
[target.'cfg(target_family = "wasm")'.dependencies]
web-time = "1"
rust-embed = { workspace = true, features = ["debug-embed"] }

# Lower priority of the warming thread (`world.rs`) without `unsafe`: the same
# version typst-kit already pulls in.
[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
rustix = { version = "1", features = ["process", "thread"] }

[build-dependencies]
# A label of the rendering code for the disk cache (build.rs).
siphasher.workspace = true

[dev-dependencies]
tempfile.workspace = true
# A math font for the WOFF2 test (the one embedded in typst-kit).
typst-assets = { version = "=0.15.1", features = ["fonts"] }

[lints]
workspace = true
