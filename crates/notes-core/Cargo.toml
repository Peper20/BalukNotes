[package]
name = "notes-core"
description = "Ядро: хранилище заметок, компиляция Typst → HTML, темы, ссылки, настройки"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Выгрузка типов API в app/src/lib/api/types (cd app && npm run types).
ts = ["dep:ts-rs"]

[dependencies]
brotli.workspace = true
fontcull.workspace = true
ttf-parser.workspace = true
typst.workspace = true
typst-html.workspace = true
typst-layout.workspace = true
typst-pdf.workspace = true
typst-kit.workspace = true
comemo.workspace = true
ecow.workspace = true
parking_lot.workspace = true
rust-embed.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
# Математический шрифт для теста WOFF2 (тот же, что встроен в typst-kit).
typst-assets = { version = "=0.15.1", features = ["fonts"] }

[lints]
workspace = true
