[package]
name = "notes-core"
description = "Ядро: хранилище заметок, компиляция Typst → HTML, темы, ссылки, настройки"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Выгрузка типов API в app/src/lib/api/types (cd app && npm run types).
ts = ["dep:ts-rs"]

[dependencies]
brotli.workspace = true
ttf2woff2.workspace = true
fontcull.workspace = true
ttf-parser.workspace = true
typst.workspace = true
typst-html.workspace = true
typst-layout.workspace = true
typst-pdf.workspace = true
typst-kit.workspace = true
comemo.workspace = true
ecow.workspace = true
notify.workspace = true
parking_lot.workspace = true
rust-embed.workspace = true
serde.workspace = true
serde_json.workspace = true
siphasher.workspace = true
thiserror.workspace = true
# Файл папки `_folder.toml` (folders.rs).
toml.workspace = true
tracing.workspace = true
ts-rs = { workspace = true, optional = true }

# Пониженный приоритет потока прогрева (`world.rs`) без `unsafe` — та же
# версия, что уже тянет typst-kit.
[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
rustix = { version = "1", features = ["process", "thread"] }

# Корзина системы для удалённых заметок (`storage.rs`); на телефоне и в
# браузере её нет.
[target.'cfg(not(any(target_os = "android", target_os = "ios", target_family = "wasm")))'.dependencies]
trash.workspace = true

[build-dependencies]
# Метка кода отрисовки для кэша на диске (build.rs).
siphasher.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Математический шрифт для теста WOFF2 (тот же, что встроен в typst-kit).
typst-assets = { version = "=0.15.1", features = ["fonts"] }

[lints]
workspace = true
