[package]
name = "notes-wasm"
description = "The core in WASM for the browser: the HTTP API of notes-server over a vault handed over by JS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# A plain library: the native build (cargo test, clippy) gets no cdylib to link.
# The module for the browser is built with `harness/build.sh`
# (`cargo rustc --crate-type cdylib --target wasm32-unknown-unknown`).

[dependencies]
notes-core.workspace = true
notes-store.workspace = true
notes-server.workspace = true
# `Bytes`, the type of a font file (`Core::add_font`).
typst.workspace = true
# The request and the body types only: no server.
axum = { version = "0.8", default-features = false }
http-body-util = "0.1"
# `oneshot`: one request to the router.
tower = { version = "0.5", default-features = false, features = ["util"] }
serde_json.workspace = true

[dev-dependencies]
# Natively the requests are driven by a current-thread runtime.
tokio = { workspace = true, features = ["rt", "macros"] }
# The hub of the sync tests: a `HubVault` in a temporary folder.
tempfile.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
# Exactly the version of wasm-bindgen-cli that generates the JS glue
# (`harness/build.sh` checks it).
wasm-bindgen = "=0.2.129"
# `request` is a JS promise; the response is a plain JS object.
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
# `datetime.today()` in Typst: the clock of chrono from JS `Date`.
chrono = { version = "0.4", default-features = false, features = ["wasmbind"] }
# Sync with the hub: a synchronous XMLHttpRequest from the worker (`xhr.rs`).
web-sys = { version = "0.3", features = ["XmlHttpRequest", "XmlHttpRequestResponseType"] }

[lints]
workspace = true

[features]
# The native measurement of E4 (tests/measure.rs): built only on request.
measure = []

[[test]]
name = "measure"
required-features = ["measure"]
