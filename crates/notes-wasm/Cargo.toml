[package]
name = "notes-wasm"
description = "Research prototype (E4): the core in WASM, one thread, a vault from JS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# A plain library: the native build (cargo test, clippy) gets no cdylib to link.
# The module for the browser is built with `harness/build.sh`
# (`cargo rustc --crate-type cdylib --target wasm32-unknown-unknown`).

[dependencies]
notes-core.workspace = true
notes-store.workspace = true
serde_json.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
# Exactly the version of wasm-bindgen-cli that generates the JS glue
# (`harness/build.sh` checks it).
wasm-bindgen = "=0.2.129"
# `datetime.today()` in Typst: the clock of chrono from JS `Date`.
chrono = { version = "0.4", default-features = false, features = ["wasmbind"] }

[lints]
workspace = true

[features]
# The native measurement of E4 (tests/measure.rs): built only on request.
measure = []

[[test]]
name = "measure"
required-features = ["measure"]
