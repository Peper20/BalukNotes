[package]
name = "notes"
description = "The notes command: runs the light commands, calls the app parts (notes-typst, notes-app, notes-hub)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["sync"]
# `notes sync`: the device's HTTP client (TLS). The storage server's VPS builds
# `notes` without it (`--no-default-features`, tools/deploy-hub.sh).
sync = ["dep:notes-device", "dep:rpassword", "dep:serde_json"]

[dependencies]
notes-parts.workspace = true
notes-store.workspace = true
notes-device = { path = "../notes-device", optional = true }
anyhow.workspace = true
clap.workspace = true
dirs.workspace = true
rpassword = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tracing-subscriber.workspace = true

[dev-dependencies]
notes-device = { path = "../notes-device", features = ["testing"] }
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
