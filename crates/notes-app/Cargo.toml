[package]
name = "notes-app"
description = "The app window (Tauri 2) without Typst: the app/ client and the notes-typst core over a socket"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
notes.workspace = true
tauri = { version = "2", features = [] }
# The window opens maximized or fullscreen if it was so when closed.
tauri-plugin-window-state = "2"
tokio = { workspace = true, features = ["net", "fs", "signal", "macros"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
percent-encoding = "2"
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# The window's WebKit process is killed before exit (`main.rs`, `quit`).
webkit2gtk = "2"
# The window's GTK window gets the activation token to take focus on Wayland (`windows.rs`).
gtk = "0.18"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
