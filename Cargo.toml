[workspace]
resolver = "3"
members = ["crates/*"]
# Копии чужих крейтов с правками (vendor/README.md) — не члены workspace.
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
notes-core = { path = "crates/notes-core" }
notes-server = { path = "crates/notes-server" }
notes-assets = { path = "crates/notes-assets" }

# Typst закреплён точно: HTML-экспорт экспериментальный, API меняется между
# версиями. Обновлять осознанно, с прогоном tests/vault (docs/tech-debt.md).
typst = "=0.15.1"
typst-html = "=0.15.1"
typst-layout = "=0.15.1"
typst-pdf = "=0.15.1"
typst-kit = { version = "=0.15.1", features = [
    "embedded-fonts", "scan-fonts", "system-files", "system-downloader", "datetime",
] }
# Версии — как у самого typst (см. Cargo.lock): иначе две копии кэша comemo.
comemo = "0.5.1"
ecow = "0.2.6"

anyhow = "1"
axum = "0.8"
# Шрифты для браузера (notes-core::webfonts): подмножества по наборам знаков
# и WOFF2. brotli и ttf-parser — те же версии, что уже тянут tower-http и typst.
brotli = "8"
# WOFF2 с преобразованием glyf (−11 % к частям шрифтов TrueType); тянет brotli 9.
ttf2woff2 = { version = "0.13.3", default-features = false }
fontcull = { version = "2.0.1", default-features = false }
ttf-parser = "0.25"
clap = { version = "4.6", features = ["derive", "env"] }
# Каталоги пользователя (данные, настройки) для `notes` — та же версия, что
# уже тянет typst-kit.
dirs = "6"
# Наблюдатель файлов хранилища (notes-core::watch): индекс ссылок, прогрев,
# события клиенту.
notify = "8"
parking_lot = "0.12"
rust-embed = { version = "8", features = ["mime-guess", "include-exclude"] }
serde = { version = "1", features = ["derive", "rc"] }
# Стабильный хэш версий и кэша на диске (notes-core::version) — та же
# версия, что уже тянет typst.
siphasher = "1"
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
trash = "5"
thiserror = "2"
# Файл настроек `notes` (~/.config/baluk-notes/config.toml) — та же версия,
# что уже тянет typst.
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower-http = { version = "0.6", features = ["compression-gzip", "compression-br"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Типы API для клиента на TypeScript: фича `ts` у notes-core и notes-server.
ts-rs = { version = "12", features = ["serde-json-impl", "no-serde-warnings"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic слишком шумный в этих местах:
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
non_ascii_literal = "allow"

[profile.dev.package."*"]
# Typst в отладочной сборке компилирует заметки в разы медленнее.
opt-level = 2
# У зависимостей — только номера строк (для трассировки паники): полная
# отладочная информация Typst копировалась в каждый тестовый бинарник, и
# target/debug весил ~9 ГБ, стал ~5. Наши крейты — с полной, как обычно
# (`debug = "line-tables-only"` и для них даёт лишь ещё −0,7 ГБ).
debug = "line-tables-only"

# comemo с правкой: после полной очистки кэша (`evict(0)`) память
# отдаётся, а не остаётся ёмкостью структур — vendor/README.md.
[patch.crates-io]
comemo = { path = "vendor/comemo" }
