[workspace]
resolver = "3"
members = ["crates/*"]
# Copies of foreign crates with patches (.claude/rules/vendor.md), not workspace members.
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
notes = { path = "crates/notes" }
notes-core = { path = "crates/notes-core" }
notes-store = { path = "crates/notes-store" }
notes-hub = { path = "crates/notes-hub" }
notes-server = { path = "crates/notes-server" }
notes-assets = { path = "crates/notes-assets" }

# Typst is pinned exactly: HTML export is experimental, the API changes between
# versions. Update deliberately, with a run over tests/vault (docs/tech-debt.md).
typst = "=0.15.1"
typst-html = "=0.15.1"
typst-layout = "=0.15.1"
typst-pdf = "=0.15.1"
typst-render = "=0.15.1"
typst-kit = { version = "=0.15.1", features = [
    "embedded-fonts", "scan-fonts", "system-files", "system-downloader", "datetime",
] }
# Versions as in typst itself (see Cargo.lock): otherwise two copies of the comemo cache.
comemo = "0.5.1"
ecow = "0.2.6"

anyhow = "1"
axum = "0.8"
# Fonts for the browser (notes-core::webfonts): subsets by character sets and
# WOFF2. brotli and ttf-parser are the versions tower-http and typst already pull.
brotli = "8"
# WOFF2 with the glyf transform (-11 % on TrueType font chunks); pulls brotli 9.
ttf2woff2 = { version = "0.13.3", default-features = false }
fontcull = { version = "2.0.1", default-features = false }
ttf-parser = "0.25"
# Fallback CFF text font -> TrueType for the browser (webfonts::cff_to_truetype):
# outlines - skrifa, glyf/loca - write-fonts, curves - kurbo. The versions
# typst-svg and typst-pdf already pull.
skrifa = { version = "0.42", default-features = false, features = ["std"] }
write-fonts = { version = "0.48", default-features = false }
kurbo = { version = "0.13", default-features = false, features = ["std"] }
clap = { version = "4.6", features = ["derive", "env"] }
# User directories (data, settings) for `notes`: the version typst-kit already
# pulls.
dirs = "6"
# Vault file watcher (notes-core::watch): the link index, warming, events for
# the client.
notify = "8"
parking_lot = "0.12"
# Percent-encoding of path segments in the hub client: the version url/ureq already pull.
percent-encoding = "2"
# A password prompt without echo (`notes users`).
rpassword = "7"
rust-embed = { version = "8", features = ["mime-guess", "include-exclude"] }
serde = { version = "1", features = ["derive", "rc"] }
# Stable hash of versions and the disk cache (notes-core::version): the version
# typst already pulls.
siphasher = "1"
serde_json = { version = "1", features = ["preserve_order"] }
# Allocator of the `notes` binary: returns memory to the system after builds by
# itself (glibc keeps hundreds of MB of free chunks; docs/research/E5.md). Does
# not build under MSVC - the system one there.
tikv-jemallocator = "0.6"
tempfile = "3"
trash = "5"
# The hub client (notes-hub::client), blocking HTTP: the version and the TLS backend
# (native-tls) typst-kit already uses, so there is one TLS stack.
ureq = { version = "2.12", default-features = false, features = ["native-tls"] }
thiserror = "2"
# Settings file of `notes` (~/.config/baluk-notes/config.toml): the version typst
# already pulls.
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower-http = { version = "0.6", features = ["compression-gzip", "compression-br"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# API types for the TypeScript client: the feature `ts` of notes-core and notes-server.
ts-rs = { version = "12", features = ["serde-json-impl", "no-serde-warnings"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic is too noisy in these places:
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
non_ascii_literal = "allow"
# Panic outside tests only through an `expect` under
# `#[expect(clippy::expect_used, reason = "...")]` (.claude/rules/crates.md).
unwrap_used = "warn"
expect_used = "warn"

[profile.dev.package."*"]
# Typst in a debug build compiles notes many times slower.
opt-level = 2
# Dependencies get line numbers only (for panic traces): the full debug info of
# Typst was copied into every test binary, and target/debug weighed ~9 GB, now
# ~5. Our crates get the full one as usual (`debug = "line-tables-only"` would
# save only another 0.7 GB on them).
debug = "line-tables-only"

# comemo with a patch: after a full cache clear (`evict(0)`) memory is given
# back instead of staying as the capacity of structures - .claude/rules/vendor.md.
[patch.crates-io]
comemo = { path = "vendor/comemo" }
